services:
  q:
    build: .
    image: question-q:latest
    environment:
      Q_HOME: /data/.q
      # Pass through whatever pi provider credentials/config you use, for example:
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - q-data:/data/.q
      # Optional: mount local pi config if your pi setup relies on it.
      # - ~/.pi:/root/.pi:ro
    stdin_open: true
    tty: true

volumes:
  q-data:
